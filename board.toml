# Board description of the Xiaomi Mi 8 (dipper, SDM845), read by the unixnu build driver.
#
# Bring-up milestone 1 is the UEFI firmware and UniXNU menu. Kernel, UFS, touch, charging and userdata stay staged
# until each stage is verified on the standard dipper hardware.

[board]
name = "dipper"
soc = "SDM845"
description = "Xiaomi Mi 8"
# The inherited fajita scripts resolve their package as kits/fajita even on
# dipper. Keep that build-tree name until every device script is renamed.
kit = "fajita"

# The initial target OS image: the unchanged iPad7,1 iPadOS 17.7.11 restore image, shared with the qualified SDM845
# bring-up. SDM845 is ARMv8.2 without
# pointer authentication, so it runs arm64 userlands only; iPadOS 17 on A10X is the newest one the XNU source matches.
# iOS 16.7.16 for the iPhone X is the planned phone userland; see NOTES-ios16.md. Give --ipsw PATH to use a local file;
# without it the remote url is read with range requests, only the members that are needed.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]   # the small components

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# Measured from the primary GPT saved before the cache partition type change.
# The generated root image is about 8.74 GiB and replaces Android data only if
# explicitly flashed to the userdata partition.
[userdata]
first_lba = 11776256
last_lba = 14397695
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "dipper_defconfig"
# Archive builders of the kernel step, in order: the generic part of the sheng list.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-arm-driver.py NativeAES",
  "build-native-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "build-fajita-storage.py",          # storage ABI audit and NativeVirtioBlock bindings (needs FAJITA_STORAGE_CANDIDATE)
  "build-arm-driver.py NativeRamBlock",   # the RAM-backed Data volume (/private/var) from the Data seed
  "build-native-virtio-bindings.py --component NativeRamBlock --directory build/native-ram-block",
  "build-fajita-verified-root.py",    # owner keys, OS and SystemOS policies, libVerifiedRootProbe.a (needs the OS images)
  "build-arm-driver.py NativeUfs",
  "build-fajita-dwc3.py",             # NativeDwc3: SDM845 DWC3 USB device-mode probe (default-off; native-dwc3-probe=1), for the SSH-over-USB channel
  "build-sheng-platform-power.py",
  "build-boot-progress.py",          # kits/fajita (from UniXNU-sheng d92e799): boot progress, fault probe, watchdog/lite job policy, diag export    # the PMGR the original AMFI needs, from UniXNU-sheng
  "build-native-legacy-display.py",  # CPU-rendered display (NativeLegacyDisplay over the UEFI framebuffer), HID input, keystore stub
  "build-fajita-touch.py",           # libFajitaTouch.a: S3706B touch over GENI I2C (fajita-touch=<stage>, default off), see NOTES-touch.md
  "build-fajita-cpufreq.py",         # libFajitaCpuFreq.a: OSM CPU clocks and per-core MHz (fajita-cpufreq=<n>, default off)
]

# The pin and early initializer are the sheng values: the same 21H461 kernelcache. The roots are the sheng list,
# known to prelink with it; trim them during bring-up.
[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOHIDEventDriver",
]

# The Mu-Silicium checkout (--uefi) gets Platforms/Xiaomi/dipperPkg from scripts/make-dipper-uefi.py, which
# derives it from equuleusPkg (Xiaomi Mi 8 screen-fingerprint variant, same SDM845 generation).
[firmware]
config = "dipper"                  # Resources/Configs/dipper.toml in the Mu-Silicium checkout (--uefi)
dsc = "Platforms/Xiaomi/dipperPkg/dipper.dsc"
fd = "Build/dipperPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
DEVICE_MODEL = "dipper"
BUILDID_STRING = "dipper-bringup"
# Defaults of Mu-Silicium build_uefi.py and DeviceBuild.py, which unixnu does not run.
ENABLE_SECUREBOOT = 0
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel and its device tree. The loader
# (DarwinBoot) is part of the firmware volume. First kernel boot: no storage driver, so XNU is expected to reach the
# video console and stop at the root device. dram_size is the 8 GiB of the 256 GB model.
[payload]
volume = "DIPPERESP"
# The payload is flashed to a dedicated FAT volume, not carried in the boot image
# (the ABL refuses large ramdisks). Use the backed-up 256 MiB cache partition for
# this 192 MiB image. Dipper has no A/B slots: never use system_a, which contains
# the active Android system.
size_mib = 192
loader = "firmware"
title = "dipper first boot: XNU to console"
# Conservative 6 GiB value so the 6 GiB and 8 GiB models can share this initial board file. Raise it only after
# reading the real /memory size on the exact phone.
dram_size = "0x180000000"
# Patch a copy of the kernel with the sheng boot probes (scripts/patch-xnu-entry-probe.py --panic-screen --no-reset):
# a blue band at kernel entry, a magenta band before the MMU is enabled, and panic() drawn on the screen.
panic_screen = true
# The static and System trust caches of 21H461, for the userland stages.
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "8900d6a93d7a59ce1a872a5c081e559f4240a218f97e12d44d22dda46644d68f",
]
# No "-v": DarwinBoot then hands XNU v_display 1 (BootVideo.h), the console is in graphics mode, and NativeLegacyDisplay takes the
# firmware framebuffer as the main display (startHardware: primary = v_display == 1). With "-v" the local DarwinBoot change clears
# v_display, so the display never accepts a swap. boot-progress (below) shows the kernel console lines instead, until the display
# takes the screen at its first presented frame (boot_progress_prepare_scanout).
kernel_args = [
  "debug=0x14e",
  "kt_fixed_zones=120",
  # First hardware boot stays read-only: inspect the live OSM LUT without
  # voting, and prove the Data-store window without writing Android userdata.
  "armcpu-timer-intid=19","-apfs_shared_datavolume","ml-timeout-lock-panic-scale=40","sheng-staged-apps=1","sheng-disable-watchdogd=1","sheng-lite=1","sheng-data-persist=1","boot-progress=2","sheng-log=1","sheng-autoreset=2400","pcpu=0xf0","fajita-wdog=3","sheng-smp=1","cpus=8","armcpu-self-ipi=1","fajita-cpufreq=1","native-data-writeback=0",
  "-no_slto_panic",
  "native-ufs-root=1",
  
  "native-ufs-smmu-stream=0x100",     # SDM845: iommus = <&apps_smmu 0x100 0xf>
  "native-ufs-smmu-mask=0xf",
  "native-ufs-smmu-size=0x80000",     # apps_smmu reg size
  "native-ufs-smmu-adopt=1",          # the firmware leaves 0x800f0100 on its own bank 2 with translation off; keep it
  "native-ufs-diagnostics=1",
  "sheng-pmgr=2",
  # CPU-rendered UI, the sheng set (UniXNU-sheng board.toml kernel_args) without its GPU, touch, cpufreq and SMP arguments.
  "offline-mobile-graphics-load=1",   # load IOMobileGraphicsFamily, register NativeLegacyDisplay (offline-component-load-probes.patch)
  "offline-mobile-graphics-client=1",
  "offline-legacy-register=1",
  "offline-legacy-phase=4",           # attach the GOP nub as /arm-io/gop-display (display-subsystem) and start the display there
  "offline-legacy-gop=1",             # map the UEFI framebuffer (1080x2248, 32 bpp)
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",        # accept one full-screen BGRA IOSurface (or a blank frame) per swap
  "offline-legacy-transfer=1",        # CPU copy of each accepted surface into the framebuffer
  "offline-legacy-cpu-present=1",     # retire each swap after its copy
  # Driver-internal option names still use the inherited fajita prefix until the display implementation is renamed.
  "offline-legacy-unit-scale=2","fajita-display-logical=2048x2732","fajita-fb-wc=1","fajita-fb-src-cached=1","sheng-fb-diff=1",
  "sheng-vsync=60",                   # software vsync for the render server; the s6e3fc2x01 runs at 60 Hz (sheng: 144)
  "sheng-banner=0",                   # no diagnostic painting over the system frames
  "offline-hid-input=1",              # load IOHIDFamily and IOHIDEventDriver
  "offline-hid-home=1",               # publish NativeHidInput (keyboard/Home collection; no touch until a fajita touch driver)
  "offline-key-events=1",             # the owned AppleKeyStore (NativeKeyStoreEvents): no SEP on this board
  "sheng-aks=1",                      # it answers the keybag state queries: no passcode, unlocked
  "sheng-gpu-addon=1",                # mount the PNG wallpaper of the payload's addon (scripts/make-fajita-wallpaper-addon.py), if any
]

# Fixups of signed text, applied by the kernel after signature validation (patches/xnu/native-text-fixup.patch); they reach it as
# /chosen/text-fixups, not on the command line. Each is <file name>,<file offset>,<original>,<replacement>, in hex.
text_fixups = [
  # +[AWAttentionAwarenessConfiguration initialize] (21H461) only forces +[AWClientPreferences initialize] and deadlocks
  # SpringBoard startup against it (ABBA between the main thread and Siri's SASMyriadController); it returns at once instead.
  "dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9",
  # PosterBoardServices: PRSPosterPathURLResourceValues and PRSPosterPathFileAttributes require NSFileProtectionNone, which a Data
  # volume without data protection never reports, so PosterBoard's data store is never viable ("Failed to migrate to Version 61
  # from 59") and no poster, hence no wallpaper, is ever made. Both dictionaries keep only their first entry (readable / POSIX mode).
  "dyld_shared_cache_arm64.13,1b05bec,44008052,24008052",
  "dyld_shared_cache_arm64.13,1b05b08,44008052,24008052",
  # BTAudioHALPlugin's factory returns NULL, so audiomxd skips it: with bluetoothd disabled (sheng-lite) the plugin reconnects to the
  # missing com.apple.BTAudioHALPlugin.xpc in a tight loop (about 2700 times a second, millions of log lines, one core busy).
  "BTAudioHALPlugin,38bec,ffc300d1f44f01a9,000080d2c0035fd6",
]

[payload.adt]
tool = "scripts/make-dipper-adt.py"
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"   # the 21H461 OS volume, read from the image
owned_memory_size = "0x130000000"   # 4.75 GiB, as sheng: 3 GiB ran out of memory 2 minutes into userland (2026-10-22)
# The Data seed (data-seed.json, built by the Data seed workflow) arrives packed (DBRDISK1); NativeRamBlock serves it.
packed_data_ramdisk = true
# sheng-data-persist=2: Data writes go through to a store window at the end of userdata (NativeUfs), not to RAM.
persistent_data = true
# The iPad identity (model iPad7,1, target-type J120): libMobileGestalt prefix-matches hw.product against iPhone/iPod/iPad.
ipad_identity = true
# chip_id and the platform seed (/chosen/unique-chip-id) seed IOPlatformUUID; the seed is per device and kept out of Git
# (UNIXNU_UNIQUE_CHIP_ID, .cache/platform-seed).
chip_id = "207"
unique_chip_id = "required"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
psci_method = "smc"

# Android boot-image parameters used by the existing dipper UEFI build. dipper is slotless in its stock layout, so
# do not copy fajita's A/B set_active workaround.
[bootimg]
# Qualcomm dipper accepts fastboot boot images but does not leave the Android
# ramdisk field resident for this UEFI chain. Keep a diagnostic copy in the
# kernel stream, where BootShim's input buffer is guaranteed to be loaded.
embed_ramdisk_in_kernel = true

[bootimg.image]
header_version = 0
pagesize = 4096
base = 0x0
kernel_offset = 0x8000
ramdisk_offset = 0x1000000
tags_offset = 0x100

# dipper's inherited DTB names 0x84994000 as the ramdisk base. The current
# diagnostic FAT is small, so provide the corresponding 64-bit Linux
# initrd range explicitly. Adjust initrd-end when the payload size changes.
[[bootimg.dtb_node]]
path = "/chosen"
props = [
  { name = "linux,initrd-start", type = "x", value = ["0x0", "0x84994000"] },
  { name = "linux,initrd-end", type = "x", value = ["0x0", "0x84d94000"] },
]
